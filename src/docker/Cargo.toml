[package]
name = "todo-docker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
todo-core.workspace = true
axum = { workspace = true, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "mysql", "migrate", "macros"] }
getrandom = "0.4"
